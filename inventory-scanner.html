<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品管理システム - QRスキャン版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 40px 30px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #666;
            font-size: 16px;
        }

        .result {
            text-align: center;
            padding: 40px 20px;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .result h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .result p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .item-details {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            text-align: left;
        }

        .item-detail {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .item-detail:last-child {
            border-bottom: none;
        }

        .item-detail label {
            font-weight: 600;
            color: #555;
        }

        .item-detail span {
            color: #333;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-badge.borrowed {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.returned {
            background: #d4edda;
            color: #155724;
        }

        .user-scan-section {
            margin-top: 25px;
            padding: 20px;
            background: #e7f3ff;
            border-radius: 12px;
            border: 2px dashed #2196F3;
        }

        .user-scan-section h3 {
            color: #1976D2;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        .user-scan-section p {
            color: #555;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }

        .user-input-section {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
        }

        .user-input-section h3 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .divider {
            margin: 25px 0;
            text-align: center;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            position: relative;
            background: white;
            padding: 0 15px;
            color: #999;
            font-size: 14px;
        }

        #userReader {
            border-radius: 12px;
            overflow: hidden;
            margin: 15px 0;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-skip {
            background: #ffc107;
            color: #333;
        }

        .btn-skip:hover {
            background: #ffb300;
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }
            
            .container {
                border-radius: 0;
                min-height: 100vh;
            }
            
            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 物品管理システム</h1>
            <p>QRコードをスキャンするだけで申請完了</p>
        </div>

        <div class="content">
            <div id="loadingView">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>処理中...</p>
                </div>
            </div>

            <div id="userScanView" style="display: none;">
                <div class="result">
                    <div class="result-icon">👤</div>
                    <h2>利用者情報を入力</h2>
                    <p id="itemInfoText">物品の貸出処理を完了するため、利用者情報を入力してください</p>
                    
                    <div class="user-input-section">
                        <h3>✏️ 利用者IDを入力</h3>
                        <div class="input-group">
                            <input type="text" id="userIdInput" placeholder="社員番号や学籍番号を入力" onkeypress="if(event.key==='Enter') submitUserId()">
                            <button class="btn btn-primary" onclick="submitUserId()">確定</button>
                        </div>
                    </div>

                    <div class="divider">
                        <span>または</span>
                    </div>
                    
                    <div class="user-scan-section">
                        <h3>📷 QRコードでスキャン</h3>
                        <p>利用者のQRコードをカメラにかざしてください</p>
                        <div id="userReader"></div>
                    </div>

                    <button class="btn btn-skip" onclick="skipUserScan()">スキップして完了</button>
                </div>
            </div>

            <div id="resultView" style="display: none;">
                <div class="result">
                    <div class="result-icon" id="resultIcon">✅</div>
                    <h2 id="resultTitle">処理完了</h2>
                    <p id="resultMessage"></p>
                    
                    <div class="item-details" id="itemDetails">
                        <div class="item-detail">
                            <label>物品ID:</label>
                            <span id="itemId">-</span>
                        </div>
                        <div class="item-detail">
                            <label>物品名:</label>
                            <span id="itemName">-</span>
                        </div>
                        <div class="item-detail">
                            <label>現在の状態:</label>
                            <span id="itemStatus">-</span>
                        </div>
                        <div class="item-detail" id="userIdRow" style="display: none;">
                            <label>利用者:</label>
                            <span id="userId">-</span>
                        </div>
                        <div class="item-detail">
                            <label>更新日時:</label>
                            <span id="updateTime">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Google Apps Script URL（固定）
        const scriptUrl = 'https://script.google.com/macros/s/AKfycby_kSZvq-IkTcm7BeLxnIb8ckVFSkvUUc-7sVTbRCjIzYuJg9YNW_84eOEGSz1lggoj/exec';

        let currentItemId = '';
        let currentItemData = null;
        let newStatus = '';
        let html5QrCode = null;

        // ページ読み込み時の処理
        window.onload = function() {
            // URLパラメータを取得
            const urlParams = new URLSearchParams(window.location.search);
            const itemId = urlParams.get('item');
            const action = urlParams.get('action');

            // URLパラメータがある場合は自動処理
            if (itemId) {
                currentItemId = itemId;
                // アクションが指定されている場合はそれを使用、なければ自動判定
                if (action) {
                    processAction(action, itemId);
                } else {
                    autoToggleAction(itemId);
                }
            } else {
                // パラメータがない場合はエラー表示
                displayError('QRコードをスキャンしてください');
            }
        };

        function showView(viewName) {
            document.getElementById('loadingView').style.display = 'none';
            document.getElementById('userScanView').style.display = 'none';
            document.getElementById('resultView').style.display = 'none';
            
            document.getElementById(viewName + 'View').style.display = 'block';
        }

        function autoToggleAction(itemId) {
            showView('loading');

            // まず現在の状態を取得
            fetch(scriptUrl + '?action=get&itemId=' + encodeURIComponent(itemId))
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        currentItemData = data.item;
                        const currentStatus = data.item.status;
                        
                        // 現在の状態に応じて反対のアクションを実行
                        if (currentStatus === '貸出中') {
                            newStatus = '返却済';
                            // 返却の場合は利用者スキャン不要
                            updateItemStatus('');
                        } else {
                            newStatus = '貸出中';
                            // 貸出の場合は利用者QRコードをスキャン
                            showUserScanView();
                        }
                    } else {
                        displayError('物品が見つかりません: ' + itemId);
                    }
                })
                .catch(error => {
                    displayError('エラー: ' + error.message);
                });
        }

        function processAction(action, itemId) {
            showView('loading');

            // アクションを日本語に変換
            const statusMap = {
                'checkout': '貸出中',
                'return': '返却済'
            };
            newStatus = statusMap[action];

            if (!newStatus) {
                displayError('不明なアクション: ' + action);
                return;
            }

            // まず物品情報を取得
            fetch(scriptUrl + '?action=get&itemId=' + encodeURIComponent(itemId))
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        currentItemData = data.item;
                        
                        if (action === 'checkout') {
                            // 貸出の場合は利用者QRコードをスキャン
                            showUserScanView();
                        } else {
                            // 返却の場合は利用者スキャン不要
                            updateItemStatus('');
                        }
                    } else {
                        displayError('物品が見つかりません: ' + itemId);
                    }
                })
                .catch(error => {
                    displayError('エラー: ' + error.message);
                });
        }

        function showUserScanView() {
            showView('userScan');
            
            document.getElementById('itemInfoText').textContent = 
                `${currentItemData.name}（ID: ${currentItemData.id}）の貸出処理を完了するため、利用者情報を入力してください`;
            
            // 入力欄をクリア
            document.getElementById('userIdInput').value = '';
            
            // QRコードスキャナーを起動
            startUserQrScanner();
        }

        function submitUserId() {
            const userId = document.getElementById('userIdInput').value.trim();
            
            if (!userId) {
                alert('利用者IDを入力してください');
                return;
            }
            
            // QRスキャナーを停止
            if (html5QrCode) {
                html5QrCode.stop();
            }
            
            // 利用者IDを使って物品を更新
            updateItemStatus(userId);
        }

        function startUserQrScanner() {
            html5QrCode = new Html5Qrcode("userReader");
            
            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 }
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onUserQrScanSuccess,
                onUserQrScanError
            ).catch(err => {
                console.error("カメラの起動に失敗:", err);
                // カメラが使えない場合はスキップを促す
                alert('カメラの起動に失敗しました。「スキップして完了」ボタンを押してください。');
            });
        }

        function onUserQrScanSuccess(decodedText, decodedResult) {
            // スキャン成功
            if (html5QrCode) {
                html5QrCode.stop().catch(err => console.log(err));
            }
            
            // 利用者IDを使って物品を更新
            updateItemStatus(decodedText);
        }

        function onUserQrScanError(errorMessage) {
            // エラーは無視（頻繁に発生するため）
        }

        function skipUserScan() {
            if (html5QrCode) {
                html5QrCode.stop().catch(err => console.log(err));
            }
            updateItemStatus('');
        }

        function updateItemStatus(userId) {
            showView('loading');

            let updateUrl = scriptUrl + 
                '?action=update&itemId=' + encodeURIComponent(currentItemId) + 
                '&status=' + encodeURIComponent(newStatus);
            
            if (userId) {
                updateUrl += '&userId=' + encodeURIComponent(userId);
            }

            fetch(updateUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const actionType = newStatus === '貸出中' ? 'checkout' : 'return';
                        const updatedItem = {
                            ...currentItemData, 
                            status: newStatus,
                            lastUser: userId || currentItemData.lastUser
                        };
                        displayResult(updatedItem, actionType, true, userId);
                    } else {
                        displayError('更新に失敗しました');
                    }
                })
                .catch(error => {
                    displayError('エラー: ' + error.message);
                });
        }

        function displayResult(item, action, isAutoToggle = false, userId = '') {
            showView('result');

            const actionMessages = {
                'checkout': isAutoToggle ? '自動で貸出申請が完了しました' : '貸出申請が完了しました',
                'return': isAutoToggle ? '自動で返却申請が完了しました' : '返却申請が完了しました',
                null: '物品情報を表示しています'
            };

            document.getElementById('resultIcon').textContent = action ? '✅' : '📦';
            document.getElementById('resultTitle').textContent = action ? '申請完了' : '物品情報';
            document.getElementById('resultMessage').textContent = actionMessages[action];

            document.getElementById('itemId').textContent = item.id;
            document.getElementById('itemName').textContent = item.name;
            
            const statusClass = item.status === '返却済' ? 'returned' : 'borrowed';
            document.getElementById('itemStatus').innerHTML = 
                `<span class="status-badge ${statusClass}">${item.status}</span>`;
            
            // 利用者情報を表示
            if (userId || item.lastUser) {
                document.getElementById('userIdRow').style.display = 'flex';
                document.getElementById('userId').textContent = userId || item.lastUser;
            } else {
                document.getElementById('userIdRow').style.display = 'none';
            }
            
            document.getElementById('updateTime').textContent = new Date().toLocaleString('ja-JP');
        }

        function displayError(message) {
            showView('result');
            
            document.getElementById('resultIcon').textContent = '❌';
            document.getElementById('resultTitle').textContent = 'エラー';
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('itemDetails').style.display = 'none';
        }
    </script>
</body>
</html>
